[package]
name = "embedded-iperf2"
description = "An iperf 2 client and server for no_std targets, wire compatible with iperf 2.2.2."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"

[features]
# The driver for a board, over an embassy-net stack.
embassy-net = ["dep:embassy-net", "dep:embassy-time", "dep:embassy-futures"]
# The driver for a host, over the standard library's sockets.
std = []

[dependencies]
# smoltcp refuses to build without a medium. `medium-ip` is the smallest, and a board adds its own.
embassy-net = { version = "0.9.1", optional = true, features = ["proto-ipv4", "tcp", "udp", "medium-ip"] }
embassy-time = { version = "0.5", optional = true }
embassy-futures = { version = "0.1", optional = true }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
# T-6 runs two stacks over an in-memory Ethernet link, on the host's clock.
embassy-net = { version = "0.9.1", features = ["proto-ipv4", "tcp", "udp", "medium-ethernet"] }
embassy-net-driver = "0.2"
embassy-time = { version = "0.5", features = ["std", "generic-queue-64"] }
embassy-time-driver = "0.2"
embassy-futures = "0.1"

[lints]
workspace = true
