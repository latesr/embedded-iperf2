[package]
name = "xtask"
description = "Repository tasks: the checks and the shared commands. Not published."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
if-addrs = "0.15"
# Its `#[mutants::skip]` marks the shared functions that a host test cannot check.
mutants = "0.0.4"
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "std"] }
pulldown-cmark = { version = "0.13", default-features = false }
toml = "0.9"

[dev-dependencies]
# The size tests write a small ELF image to read back.
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "std", "write"] }

[lints]
workspace = true
