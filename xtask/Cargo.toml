[package]
name = "xtask"
description = "Repository tasks: the checks and the shared commands. Not published."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
# The `std` driver, one of `cargo xtask hil`'s host ends.
embedded-iperf2 = { path = "../embedded-iperf2", features = ["std"] }
pulldown-cmark = { version = "0.13", default-features = false }
toml = "0.9"

[lints]
workspace = true
