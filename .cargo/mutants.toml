# Files that only start other programs, or open sockets, have no unit tests. Their check is the output they
# produce, so a mutant in them survives every test run and says nothing about coverage.
exclude_globs = [
    "xtask/src/main.rs",
    "xtask/src/check.rs",
    "xtask/src/shared/hooks.rs",
    "xtask/src/shared/mutants.rs",
    "xtask/src/record/mod.rs",
    "xtask/src/iperf.rs",
    "xtask/src/fuzz.rs",
]

# Every `|` in the crate joins bits that do not overlap: flag constants, a header length shifted under `LEN_BIT`,
# or a high word shifted past a low word. `^` gives the same value there, so the mutant cannot change behaviour.
# A `|` of bits that can overlap would need this rule narrowed.
exclude_re = [
    'embedded-iperf2/src/.*: replace \| with \^',
    # The reset at the end of a burst is what lets BurstReader::received read on. Without it, every pass of the
    # loop reads 0 bytes, so the mutant can only loop for ever and no test can end it.
    'replace == with != in BurstReader::received',
    # The driver reads what has arrived before each poll, so the core meets a peer's bytes and close in the orders
    # a peer can make. Without it, the reads in each wait still deliver them, later. The core ends a test the same
    # way for each order (ADR-0002), so no test can tell the two apart.
    'embedded-iperf2/src/blocking.rs:.*: delete ! in run$',
]

# The tests whose names start with `stock_` run a stock iperf for about ten seconds, and would run once for each
# mutant. They check that we work with the stock binary. The tests in `tests/blocking.rs` cover the driver's code.
additional_cargo_test_args = ["--", "--skip", "stock_"]
