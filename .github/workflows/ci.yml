name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  # A person can start the nightly job from the Actions page, such as to check a fix to it.
  workflow_dispatch:

# No job writes to the repo.
permissions:
  contents: read

# A new push to a pull request cancels the pull request's older run. Every other run has a group of its own, because
# GitHub holds only one pending run per group, and a newer run would cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The mutation step diffs against the commit before the push, so it needs the history.
          fetch-depth: 0
      - name: Install the pinned toolchain and targets
        run: rustup toolchain install
      - name: Install the MSRV toolchain
        run: rustup toolchain install 1.91 --profile minimal
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      # The interoperability tests run a stock iperf 2.2.2, and package managers do not have that version. The cache
      # key names the pin, so a new pin builds the binary again.
      - uses: actions/cache@v6
        with:
          path: ~/.local/opt/iperf/2.2.2
          key: iperf-2.2.2-74d4b553
      - run: cargo xtask install-iperf
      - run: echo "MCU_IPERF2=$HOME/.local/opt/iperf/2.2.2/iperf" >> "$GITHUB_ENV"
      - run: cargo xtask check --full
      # Cargo rewrites a lock file that does not match its manifests, and the check then tests what was not committed.
      - name: Fail on a lock file that the check changed
        run: git diff --exit-code -- '*Cargo.lock'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      # For a new branch, GitHub sends all zeros as the commit before the push. A force push can send a commit that
      # is gone. The merge base with main covers both cases.
      - name: Mutation test the lines this push or pull request changes
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git merge-base HEAD origin/main)"
          fi
          cargo xtask mutants --base "$base"

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain and targets
        run: rustup toolchain install
      - name: Install nightly for the fuzzer
        run: rustup toolchain install nightly-2026-10-11 --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz,cargo-hack,cargo-mutants
      - uses: Swatinem/rust-cache@v2
      # cargo xtask check --full covers each feature alone and each pair. This covers every combination.
      - name: Check every feature combination
        run: cargo hack check --workspace --feature-powerset --no-dev-deps
      - name: Fuzz the parser for ten minutes
        run: cargo xtask fuzz --seconds 600
      # The crash input is the regression test that TESTING.md asks for, and it is lost with the runner.
      - name: Keep the crash input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
      - name: Mutation test every crate
        run: cargo xtask mutants --all
