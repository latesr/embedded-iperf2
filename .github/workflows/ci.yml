# This workflow does not run until the repo has a remote. Until then, run `cargo xtask check --full` by hand.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The mutation step diffs against the commit before the push, so it needs the history.
          fetch-depth: 0
      - name: Install the pinned toolchain and targets
        run: rustup show
      - name: Install the MSRV toolchain
        run: rustup toolchain install 1.91 --profile minimal
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      # The interoperability tests run a stock iperf 2.2.2, and package managers do not have that version. The cache
      # key names the pin, so a new pin builds the binary again.
      - uses: actions/cache@v4
        with:
          path: ~/.local/opt/iperf/2.2.2
          key: iperf-2.2.2-74d4b553
      - run: cargo xtask install-iperf
      - run: echo "MCU_IPERF2=$HOME/.local/opt/iperf/2.2.2/iperf" >> "$GITHUB_ENV"
      - run: cargo xtask check --full
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      # For a new branch, GitHub sends all zeros as the commit before the push. A force push can send a commit that
      # is gone. The merge base with main covers both cases.
      - name: Mutation test the lines this push or pull request changes
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git merge-base HEAD origin/main)"
          fi
          cargo xtask mutants --base "$base"

  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain and targets
        run: rustup show
      - name: Install nightly for the fuzzer
        run: rustup toolchain install nightly-2026-10-11 --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz,cargo-hack,cargo-mutants
      - uses: Swatinem/rust-cache@v2
      # cargo xtask check --full covers each feature alone and each pair. This covers every combination.
      - name: Check every feature combination
        run: cargo hack check --workspace --feature-powerset --no-dev-deps
      - name: Fuzz the parser for ten minutes
        run: cargo xtask fuzz --seconds 600
      - name: Mutation test every crate
        run: cargo mutants --workspace
