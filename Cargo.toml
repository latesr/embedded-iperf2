[workspace]
resolver = "3"
members = ["embedded-iperf2", "xtask"]
# The fuzz crate is its own workspace, because cargo-fuzz builds it with its own flags on nightly. Each board's
# firmware is its own workspace, because it builds for the board.
exclude = ["fuzz", "firmware"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/latesr/embedded-iperf2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
