[build]
target = "riscv32imafc-unknown-none-elf"

[target.riscv32imafc-unknown-none-elf]
runner = "mcu-run run --chip esp32s31"
rustflags = [
    "-C", "link-arg=-Tdefmt.x",
    "-C", "link-arg=-Tlinkall.x",
    "-C", "force-frame-pointers",
]

[env]
DEFMT_LOG = "info"
# esp-hal includes the build script's rwtext_hook.x in .rwtext.
ESP_HAL_CONFIG_USE_RWTEXT_LD_HOOK = "true"
